services:
  app:
    image: ${APP_IMAGE}
    container_name: app
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      INSTANCE_ID: ${INSTANCE_ID:-app-aws-1}

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${HIKARI_MIN_IDLE}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${HIKARI_MAX_LIFETIME}
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${HIKARI_IDLE_TIMEOUT}

      SERVER_TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX}
      SERVER_TOMCAT_THREADS_MIN_SPARE: ${TOMCAT_THREADS_MIN_SPARE}

      SPRING_DATA_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_DATA_REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1s}     # 기존: 1s (고정)
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 128
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 64
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 8
      
# ② 장애 테스트 env 추가      
      EDIT_SESSION_FALLBACK_MODE: ${EDIT_SESSION_FALLBACK_MODE:-db}
      CANVAS_LOCK_CLEANUP_DELAY_MS: ${CANVAS_LOCK_CLEANUP_DELAY_MS:-30000}
      REALTIME_HEALTH_CHECK_DELAY_MS: ${REALTIME_HEALTH_CHECK_DELAY_MS:-5000}

      APP_MODE: multi
      REALTIME_REDIS_PUBSUB_ENABLED: true
      REALTIME_KAFKA_ENABLED: true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      
      # Gateway discovery
      EUREKA_INSTANCE_METADATA_MAP_PUBLIC_HOST: ${EC2_PUBLIC_IP}
      EUREKA_INSTANCE_METADATA_MAP_PUBLIC_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL}      
      REALTIME_GRPC_ENABLED: ${REALTIME_GRPC_ENABLED:-true}
      REALTIME_GRPC_TARGET: ${REALTIME_GRPC_TARGET}
      REALTIME_HTTP_ENABLED: ${REALTIME_HTTP_ENABLED:-false}
      REALTIME_HTTP_TARGET: ${REALTIME_HTTP_TARGET}
      REALTIME_HTTP_HEALTH_URL: ${REALTIME_HTTP_HEALTH_URL}

      SPRING_JPA_OPEN_IN_VIEW: false
      SPRING_JPA_PROPERTIES_HIBERNATE_ENHANCER_ENABLE_LAZY_INITIALIZATION: true

    ports:
      - "8080:8080"
    networks: [appnet]
  
  frontend:
    image: ${FRONT_IMAGE}
    container_name: frontend-1
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "81:80"
    volumes:
      - ./nginx/frontend-1.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: app-node-exporter
    restart: unless-stopped
    pid: "host"
    command:
      - "--path.rootfs=/"
    ports:
      - "9100:9100"
    networks: [appnet]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: app-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /data/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [appnet]

  ebpf-exporter:
    image: ghcr.io/cloudflare/ebpf_exporter:latest
    container_name: ebpf-exporter
    privileged: true
    pid: host
    network_mode: host
    restart: unless-stopped
    command:
      - --config.dir=/examples
      - --config.names=tcp-retransmit,oomkill,cfs-throttling
      - --web.listen-address=:9435
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro

  promtail:
    image: grafana/promtail:3.2.0
    container_name: app-promtail
    restart: unless-stopped
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - INSTANCE_NAME=${INSTANCE_NAME:-app-aws}
      - INSTANCE_ID=${INSTANCE_ID}
      - TZ=Asia/Seoul
    volumes:
      - /data/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks: [appnet]

networks:
  appnet:
    driver: bridge
