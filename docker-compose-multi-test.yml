services:
  app-1:
    image: ${APP_IMAGE}:${APP_TARGET}
    container_name: app-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      INSTANCE_ID: app-1
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/trader?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s

      APP_MODE: multi
      REALTIME_REDIS_PUBSUB_ENABLED: true
      REALTIME_KAFKA_ENABLED: true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Eureka 서버 주소 (infra 노드 IP)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

      # Gateway discovery: 클라이언트가 이 주소로 직접 접속
      # EC2_PUBLIC_IP는 user-data 스크립트에서 IMDS로 주입
      EC2_PUBLIC_IP: ${EC2_PUBLIC_IP}
      EUREKA_INSTANCE_METADATA_MAP_PUBLIC_HOST: ${EC2_PUBLIC_IP}
      EUREKA_INSTANCE_METADATA_MAP_PUBLIC_PORT: 8080

    ports:
      - "8080:8080"
    networks: [appnet]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-2:
    image: ${APP_IMAGE}:${APP_TARGET}
    container_name: app-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      INSTANCE_ID: app-2
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/trader?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s

      APP_MODE: multi
      REALTIME_REDIS_PUBSUB_ENABLED: true
      REALTIME_KAFKA_ENABLED: true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Eureka 서버 주소 (infra 노드 IP)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

      # app-1과 같은 EC2_PUBLIC_IP지만 포트가 다름 (같은 EC2에서 두 인스턴스)
      EC2_PUBLIC_IP: ${EC2_PUBLIC_IP}
      EUREKA_INSTANCE_METADATA_MAP_PUBLIC_HOST: ${EC2_PUBLIC_IP}
      EUREKA_INSTANCE_METADATA_MAP_PUBLIC_PORT: 8081

    ports:
      - "8081:8080"
    networks: [appnet]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend-1:
    image: ${FRONT_IMAGE}:${FRONT_TARGET}
    container_name: frontend-1
    depends_on:
      - app-1
    ports:
      - "81:80"
    volumes:
      - ./nginx/frontend-1.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

  frontend-2:
    image: ${FRONT_IMAGE}:${FRONT_TARGET}
    container_name: frontend-2
    depends_on:
      - app-2
    ports:
      - "82:80"
    volumes:
      - ./nginx/frontend-2.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
     - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [appnet]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks: [appnet]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: local-node-exporter
    restart: unless-stopped
    pid: "host"
    command:
      - "--path.rootfs=/"
    ports:
      - "9100:9100"
    networks: [appnet]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: local-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [appnet]

  promtail:
    image: grafana/promtail:3.2.0
    container_name: local-promtail
    restart: unless-stopped
    environment:
      - LOKI_HOST=${LOKI_HOST}
      - INSTANCE_ID=local
      - TZ=Asia/Seoul
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks: [appnet]
    
networks:
  appnet:
    driver: bridge

volumes:
  redis_data:
  kafka_data: