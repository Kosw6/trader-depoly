version: "3.8"

services:
  eureka:
    image: my-eureka:latest
    container_name: eureka
    ports:
      - "8761:8761"
    networks: [appnet]

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  gateway:
    image: my-gateway:latest
    container_name: gateway
    depends_on:
      - eureka
    environment:
      SPRING_APPLICATION_NAME: gateway-service
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8080:8080"
    networks: [appnet]

  ws-1:
    image: my-trader-server:profile
    container_name: ws-1
    depends_on:
      redis:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID}
      SPRING_PROFILES_ACTIVE: profile
      SPRING_APPLICATION_NAME: ws-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/trader
      SPRING_DATA_REDIS_HOST: redis        # ← 추가
      APP_ROLE: ws
      APP_INSTANCE_ID: ws-1
      SERVER_PORT: 8082
      WS_SHARD_ID: 1
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_INSTANCE_ID: ws-service:ws-1
    ports:
      - "8082:8082"
    networks: [appnet]

  # ws-2:
  #   image: my-trader-server:profile
  #   container_name: ws-2
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     eureka:
  #       condition: service_started
  #   environment:
  #     OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
  #     OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
  #     OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID}
  #     SPRING_PROFILES_ACTIVE: profile
