services:
  db:
    image: timescale/timescaledb:2.21.2-pg17
    container_name: db
    mem_limit: 8g
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - superuser_reserved_connections=10
      - -c
      - max_locks_per_transaction=2048
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - track_io_timing=on
      - -c
      - default_statistics_target=200
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - jit=off
      - -c
      - autovacuum=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PG_RESTORE_JOBS: 4
    # ✅ 외부에 DB 노출 금지 (서버 내부에서만 접근)
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/20_restore.sh:/docker-entrypoint-initdb.d/20_restore.sh:ro
      - ./docker/trader.dump:/docker-entrypoint-initdb.d/trader.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [appnet]

  app:
    image: ${APP_IMAGE}
    container_name: app
    environment:
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 130
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 70
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 1800000
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 30000
      SERVER_TOMCAT_THREADS_MAX: 170
      SERVER_TOMCAT_THREADS_MIN_SPARE: 80
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 128
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 64
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 8
      SPRING_JPA_OPEN_IN_VIEW: false
      SPRING_JPA_PROPERTIES_HIBERNATE_ENHANCER_ENABLE_LAZY_INITIALIZATION: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ✅ app은 외부에 직접 노출하지 말고(frontend가 프록시)
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    networks: [appnet]

  # ✅ FRONTEND (Nginx + dist + /api,/ws 프록시)
  frontend:
    image: ${FRONT_IMAGE}     # ex) yourdockerhubid/trader-frontend:latest
    container_name: frontend
    depends_on:
      - app
    ports:
      - "81:80"
    networks: [appnet]

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    # ✅ 외부 노출 금지
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks: [appnet]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./../trader-monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
      - db
    networks: [appnet]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/
    volumes:
      - ./../trader-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks: [appnet]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    pid: "host"
    command:
      - "--path.rootfs=/"
    networks: [appnet]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  redis_data:
