server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_HOST}/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      - docker: {}

    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          instance: ${INSTANCE_ID}
          host: local
          __path__: /var/lib/docker/containers/*/*-json.log